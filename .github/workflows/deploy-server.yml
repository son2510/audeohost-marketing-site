name: Deploy to audeohost.com server

# Manual trigger only, on purpose: this uses `rsync --delete`, so the first
# run will replace everything currently in the target directory with this
# build. Once a manual run has been confirmed working against the live
# server, add `push: branches: [main]` back in to make it automatic like
# the GitHub Pages deploy.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

      - name: Install deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin server host key
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/known_hosts <<'EOF'
          svr92.audeohost.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO95SNnCpygednppG8Q2FUO6uAncdO9uJCQA9ksFeDO2
          EOF

      - name: Sync build to server
        run: |
          rsync -avz --delete -e "ssh -p 22" dist/ ahops@svr92.audeohost.com:/var/www/html-audeohost/
