backend:
  name: github
  repo: son2510/audeohost-marketing-site
  branch: main
  base_url: https://apadmin.audeohost.com
  auth_endpoint: api/auth

publish_mode: simple
media_folder: "src/assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/blog/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Eyebrow",
          name: "eyebrow",
          widget: "string",
          hint: "Small label above the title on the post page and its listing card, e.g. \"Guide · Matchday experience · In-venue audio\"",
        }
      - {
          label: "Excerpt",
          name: "excerpt",
          widget: "text",
          hint: "Shown as the summary on the blog listing page",
        }
      - { label: "Tags", name: "tagList", widget: "list", default: [] }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "site-data"
    label: "Site Content"
    files:
      - name: "nav"
        label: "Navigation"
        file: "src/_data/nav.json"
        fields:
          - label: "Links"
            name: "links"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link (e.g. #how or a page URL)", name: "href", widget: "string" }
          - label: "Blog button"
            name: "blogButton"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string" }
          - label: "Trial CTA button"
            name: "trialButton"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string" }

      - name: "pageSections"
        label: "Page Layout (section order)"
        file: "src/_data/pageSections.json"
        fields:
          - label: "Sections"
            name: "items"
            widget: "list"
            summary: "{{fields.key}} — visible: {{fields.visible}}"
            hint: "Drag to reorder. Every section on the homepage must appear here exactly once — this list only controls order and visibility, it doesn't create or remove sections."
            fields:
              - {
                  label: "Section",
                  name: "key",
                  widget: "select",
                  options:
                    [
                      { label: "Hero (top banner)", value: "hero" },
                      { label: "The Problem", value: "problem" },
                      { label: "One App, Whole Property", value: "hotel-ops" },
                      { label: "Fanzo Comparison", value: "fanzo" },
                      { label: "How It Works", value: "how" },
                      { label: "The Platform (two apps)", value: "platform" },
                      { label: "Use Cases", value: "cases" },
                      { label: "ROI Argument", value: "roi" },
                      { label: "Pricing", value: "pricing" },
                      { label: "FAQ", value: "faq" },
                      { label: "Testimonials", value: "testimonials" },
                      { label: "Final CTA (trial banner)", value: "final-cta" },
                      { label: "Venue Enquiry Form", value: "form" },
                    ],
                }
              - { label: "Show this section", name: "visible", widget: "boolean", default: true }

      - name: "hero"
        label: "Hero"
        file: "src/_data/hero.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - {
              label: "Headline",
              name: "headline",
              widget: "text",
              hint: "HTML allowed, e.g. <br> for a line break and <em>...</em> for the emphasised line",
            }
          - { label: "Subhead", name: "lede", widget: "text" }
          - label: "Call-to-action buttons"
            name: "ctas"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string" }
              - { label: "Style", name: "style", widget: "select", options: ["gold", "outline"] }
          - label: "Proof points"
            name: "proof"
            widget: "list"
            fields:
              - { label: "Highlighted word", name: "stat", widget: "string" }
              - { label: "Rest of the phrase", name: "text", widget: "string" }
          - label: "Hero photo"
            name: "image"
            widget: "object"
            fields:
              - { label: "Photo", name: "src", widget: "image" }
              - { label: "Alt text (for screen readers)", name: "alt", widget: "string" }

      - name: "problem"
        label: "The Problem section"
        file: "src/_data/problem.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subhead", name: "subhead", widget: "text" }
          - label: "Cards"
            name: "cards"
            widget: "list"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

      - name: "hotelOps"
        label: "One App, Whole Property section"
        file: "src/_data/hotelOps.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subhead", name: "subhead", widget: "text" }
          - label: "Moments"
            name: "moments"
            widget: "list"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Closing strip", name: "beatStrip", widget: "text" }

      - name: "fanzo"
        label: "Competitive (Fanzo) section"
        file: "src/_data/fanzo.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subhead", name: "subhead", widget: "text" }
          - label: "Beats"
            name: "beats"
            widget: "list"
            fields:
              - { label: "Style", name: "style", widget: "select", options: ["beyond", "with", "own"] }
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Closing strip", name: "beatStrip", widget: "text" }

      - name: "how"
        label: "How It Works section"
        file: "src/_data/how.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subhead", name: "subhead", widget: "text" }
          - label: "Steps"
            name: "steps"
            widget: "list"
            hint: "Numbered automatically in order — reorder the list to renumber"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

      - name: "platform"
        label: "The Platform (two apps) section"
        file: "src/_data/platform.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subhead", name: "subhead", widget: "text" }
          - label: "Cards"
            name: "cards"
            widget: "list"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Closing strip", name: "beatStrip", widget: "text" }

      - name: "cases"
        label: "Use Cases section"
        file: "src/_data/cases.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subhead", name: "subhead", widget: "text" }
          - label: "Cards"
            name: "cards"
            widget: "list"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "List items", name: "items", widget: "list" }

      - name: "roi"
        label: "ROI Argument section"
        file: "src/_data/roi.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subhead", name: "subhead", widget: "text" }
          - label: "Contrast cards"
            name: "contrast"
            widget: "list"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Closing strip", name: "beatStrip", widget: "text" }

      - name: "finalCta"
        label: "Final CTA section"
        file: "src/_data/finalCta.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subhead", name: "subhead", widget: "text" }
          - { label: "Primary button label", name: "primaryCtaLabel", widget: "string" }
          - label: "Demo button"
            name: "demoCta"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string" }
          - label: "Contact labels"
            name: "contactLabels"
            widget: "object"
            fields:
              - { label: "\"Email\" label", name: "email", widget: "string" }
              - { label: "\"Phone\" label", name: "phone", widget: "string" }
              - { label: "\"Audeo-Portal\" label", name: "portalLabel", widget: "string" }
              - { label: "Portal value text", name: "portalValue", widget: "string" }
          - { label: "Link to the venue-enquiry form", name: "formLinkText", widget: "string" }

      - name: "venueFormSection"
        label: "Venue Enquiry Form intro"
        file: "src/_data/venueFormSection.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subhead", name: "subhead", widget: "text" }
          - { label: "Submit button label", name: "submitLabel", widget: "string" }

      - name: "footer"
        label: "Footer"
        file: "src/_data/footer.json"
        fields:
          - label: "Links"
            name: "links"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string" }
          - { label: "Copyright line", name: "copyright", widget: "string" }

      - name: "pricing"
        label: "Pricing"
        file: "src/_data/pricing.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subhead", name: "subhead", widget: "text" }
          - label: "Rows"
            name: "rows"
            widget: "list"
            fields:
              - { label: "Product name", name: "label", widget: "string" }
              - { label: "Show \"from\" before the price", name: "priceFrom", widget: "boolean", default: true }
              - { label: "Price", name: "price", widget: "string", hint: "Number only, e.g. 69.99 — currency symbol is added automatically per region" }
              - { label: "Period", name: "period", widget: "string", hint: "e.g. /mo or /mo per area" }
              - { label: "Highlight as the recommended bundle", name: "bundle", widget: "boolean", default: false }
              - { label: "Description", name: "description", widget: "string" }
          - {
              label: "Trial note (text after the bundle price)",
              name: "trialNoteSuffix",
              widget: "text",
            }

      - name: "regions"
        label: "Regions"
        file: "src/_data/regions.json"
        fields:
          - label: "Regions"
            name: "items"
            widget: "list"
            fields:
              - { label: "Key", name: "key", widget: "string", hint: "Short code, e.g. eu, uk, ca — do not change on an existing region" }
              - { label: "Button Label", name: "label", widget: "string" }
              - { label: "Currency Symbol", name: "currency", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - {
                  label: "Enquiry Form Country Code",
                  name: "enquiryApiCode",
                  widget: "string",
                  hint: "IE, UK, or CA — controls postcode format validation on the enquiry form",
                }

      - name: "faq"
        label: "FAQ"
        file: "src/_data/faq.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - label: "Questions"
            name: "items"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

      - name: "testimonials"
        label: "Testimonials"
        file: "src/_data/testimonials.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - label: "Quotes"
            name: "items"
            widget: "list"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Attribution", name: "attribution", widget: "string", hint: "e.g. Toronto, Canada — The Frog Pub • Shri P." }
